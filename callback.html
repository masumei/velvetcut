<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelvetCut — TikTok Auth Callback</title>
<style>
  :root{--velvet:#6a3ab2;--velvet-l:#ac78ee;--velvet-d:#26123a;--coral:#ff5a78;--ink:#1a1025;--paper:#faf7ff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh;
       display:grid;place-items:center;}
  .card{background:#fff;border:1px solid #eee;border-radius:16px;padding:40px;max-width:560px;width:92%;
        box-shadow:0 12px 40px rgba(26,16,37,.10);text-align:center;}
  .logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--velvet-d);letter-spacing:.4px;}
  .logo img{width:34px;height:34px;border-radius:8px;}
  h1{font-size:22px;margin:22px 0 6px;color:var(--velvet-d);}
  .sub{color:#6b5b82;margin-bottom:20px;font-size:15px;}
  .code{background:#1a1025;color:#ffe17a;font-family:ui-monospace,Consolas,monospace;font-size:16px;
        border-radius:10px;padding:16px;word-break:break-all;user-select:all;border:1px solid #3a2b4f;}
  .hint{color:#8b86a0;font-size:13px;margin-top:14px;}
  .ok{color:#2a8658;font-weight:700;}
  .err{color:#c0392b;font-weight:700;}
  .btn{display:inline-block;margin-top:18px;background:var(--coral);color:#fff;font-weight:700;
       padding:11px 22px;border-radius:9px;border:none;cursor:pointer;font-size:14px;}
  .btn:hover{filter:brightness(1.06);}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="velvetcut_logo_512.png" alt="">VelvetCut</div>
  <h1>TikTok Authorization</h1>
  <div id="status" class="sub">Processing…</div>
  <div id="codebox" class="code" style="display:none"></div>
  <div id="hint" class="hint" style="display:none">Copy the code above and paste it back into the VelvetCut CLI/prompt to finish linking your account.</div>
  <button class="btn" id="copyBtn" style="display:none">Copy code</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  const err = q.get("error");
  const st = q.get("state");
  const status = document.getElementById("status");
  const codebox = document.getElementById("codebox");
  const hint = document.getElementById("hint");
  const copyBtn = document.getElementById("copyBtn");

  if (err) {
    status.className = "sub err";
    status.textContent = "Authorization was not completed." + (err ? " Reason: " + err : "");
  } else if (code) {
    status.className = "sub ok";
    status.textContent = "Authorization successful. Copy the code and return to VelvetCut.";
    codebox.style.display = "block";
    codebox.textContent = code;
    hint.style.display = "block";
    copyBtn.style.display = "inline-block";
    history.replaceState(null, "", location.pathname); // scrub the code from the URL bar
    copyBtn.onclick = async () => {
      try { await navigator.clipboard.writeText(code); copyBtn.textContent = "Copied!"; }
      catch { copyBtn.textContent = "Select code and copy manually"; }
    };
  } else {
    status.textContent = "No authorization response found. Please return to the CLI and retry.";
  }
</script>
</body>
</html>
